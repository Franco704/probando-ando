<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Probando Ando</title>
  <meta name="description" content="Guía de estudio de Probabilidad y Estadística (UTN-FRT): teoría, laboratorios interactivos, tablas, preguntas abiertas corregidas al instante y los TP 1 a 6 resueltos, separada en primer parcial, segundo parcial y final." />
  <meta name="theme-color" content="#f7f2f3" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#171115" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23171115'/%3E%3Cpath d='M3 25C9 25 11 7 16 7S23 25 29 25' fill='none' stroke='%235fd3a3' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Onest:wght@400..800&family=Spline+Sans+Mono:wght@400..600&display=swap" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/armazon.css" />
  <link rel="stylesheet" href="styles/contenido.css" />
  <link rel="stylesheet" href="styles/estudio.css" />
  <link rel="stylesheet" href="styles/laboratorios.css" />
  <link rel="stylesheet" href="styles/vistas.css" />
  <link rel="stylesheet" href="styles/animaciones.css" />
  <script>
    // Tema guardado antes de pintar, para evitar el parpadeo (misma clave que la versión anterior)
    try { const t = localStorage.getItem('pa-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script type="module" src="src/main.js"></script>
  <style>
    /* Volver al hub UTN Ando desde la barra superior, en todas las guías */
    .ir-hub { display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none; min-width: 44px; min-height: 44px; padding: 0 10px; border-radius: 8px; color: inherit; text-decoration: none; font-weight: 600; font-size: .9rem; white-space: nowrap; }
    .ir-hub:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
    .ir-hub:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    @media (max-width: 767px) { .ir-hub { padding: 0; } .ir-hub span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } }
  </style>
</head>
<body>
  <a class="saltar" href="#principal">Saltar al contenido</a>

  <header class="barra">
    <button class="boton-icono boton-menu" id="botonMenu" type="button" aria-label="Abrir el índice" aria-expanded="false" aria-controls="cajon"></button>
    <a class="marca" href="#/"><svg class="marca-signo" viewBox="0 0 26 22" aria-hidden="true"><rect x="3" y="14" width="4" height="6"/><rect x="8" y="7" width="4" height="13"/><rect x="13" y="5" width="4" height="15"/><rect x="18" y="11" width="4" height="9"/><path d="M1 20C6 20 7 4 13 4S20 20 25 20"/></svg>Probando Ando</a>
    <nav class="barra-enlaces" aria-label="Herramientas de estudio" id="barraEnlaces"></nav>
    <div class="avance" id="avance"></div>
    <a class="ir-hub" href="https://utn-ando.github.io/" title="Volver a UTN Ando: las guías de todas las materias"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>UTN Ando</span></a>
    <button class="boton-icono" id="botonTema" type="button" aria-label="Cambiar entre tema claro y oscuro"></button>
  </header>

  <div class="marco">
    <nav class="cajon" id="cajon" aria-label="Índice de la materia">
      <div class="cajon-cabeza">
        <p>Índice</p>
        <button class="boton-icono" id="cerrarCajon" type="button" aria-label="Cerrar el índice"></button>
      </div>
      <label class="buscar">
        <span class="sr-only">Buscar un tema</span>
        <input type="search" id="buscar" placeholder="Buscar: Bayes, Poisson, intervalo…" autocomplete="off" />
      </label>
      <ul class="herramientas" id="herramientas"></ul>
      <div id="indice"></div>
      <a class="hub" href="https://utn-ando.github.io/">Ver las otras materias en UTN Ando</a>
    </nav>
    <div class="velo" id="velo" hidden></div>
    <main id="principal" tabindex="-1">
      <noscript><p>Esta guía necesita JavaScript para los laboratorios y las preguntas.</p></noscript>
    </main>
    <aside class="riel" id="riel" aria-label="En esta lección"></aside>
  </div>

  <nav class="dock" aria-label="Accesos rápidos" id="dock"></nav>
</body>
</html>
